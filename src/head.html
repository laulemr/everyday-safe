<title>Everyday Safe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap">
<style>
/* ESQ Ready 2.0. Calm, place-based learning product: editorial clarity, campus wayfinding, tactile cards.
   Green = institution and progress; blue = information; amber = attention; red only for real emergency cues. */
:root{
  --green:#275D38; --green-d:#275D38; --green-t:#EAF1EC;
  --ink:#2B292A; --muted:#595959; --canvas:#F5F5F5; --surface:#FFFFFF; --line:#E0E0E0; --line2:#CCCCCC;
  --blue:#275D38; --blue-t:#EAF1EC; --amber:#2B292A; --amber-t:#FFF8D1; --red:#B3261E; --red-t:#FCEDEA;
  --gold:#F2CD00; --evening:#728CB1;
  --u1:#2B292A; --u2:#275D38; --u3:#275D38; --u4:#6B4BB8; --u5:#2E3A73; --uf:#275D38;
  --on:#FFFFFF; --shade:rgba(15,28,24,.45);
  --f:"Roboto",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  /* aliases used by the illustration library */
  --bg:var(--canvas); --bg2:#F5F5F5; --card:var(--surface); --brand:var(--green); --brand-d:var(--green-d); --brand-hi:#007A33;
  --yellow:#F2CD00; --yellow-d:#2B292A; --orange:var(--amber); --blue-ink:var(--blue); --blue-soft:var(--blue-t); --red-soft:var(--red-t); --green-soft:var(--green-t);
  --purple:#6B4BB8; --teal:#0B6E78; --c:var(--green);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --green:#6CC08A; --green-d:#4E9E6B; --green-t:#16291D;
  --ink:#E7EEEA; --muted:#A3B3AC; --canvas:#101915; --surface:#17231D; --line:#26362E; --line2:#35493E;
  --blue:#7FB4DE; --blue-t:#132636; --amber:#E2B04A; --amber-t:#2C230F; --red:#FF8A80; --red-t:#3A1C1A;
  --u1:#E2B04A; --u2:#6CC08A; --u3:#7FB4DE; --u4:#B39DF0; --u5:#9EAAE8; --uf:#6CC08A;
  --on:#0C1511; --bg2:#14201A; --brand-hi:#6CC08A; --yellow:#F2CD00; --purple:#B39DF0; --teal:#4FB3BD; color-scheme:dark}}
:root[data-theme="dark"]{
  --green:#6CC08A; --green-d:#4E9E6B; --green-t:#16291D;
  --ink:#E7EEEA; --muted:#A3B3AC; --canvas:#101915; --surface:#17231D; --line:#26362E; --line2:#35493E;
  --blue:#7FB4DE; --blue-t:#132636; --amber:#E2B04A; --amber-t:#2C230F; --red:#FF8A80; --red-t:#3A1C1A;
  --u1:#E2B04A; --u2:#6CC08A; --u3:#7FB4DE; --u4:#B39DF0; --u5:#9EAAE8; --uf:#6CC08A;
  --on:#0C1511; --bg2:#14201A; --brand-hi:#6CC08A; --yellow:#F2CD00; --purple:#B39DF0; --teal:#4FB3BD; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font:400 17.5px/1.55 var(--f)}
h1,h2,h3{margin:0;line-height:1.2;font-weight:700;text-wrap:balance}
h1{font-size:26px} h2{font-size:21px} h3{font-size:18px}
p{margin:0}
ul,ol{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
[tabindex="-1"]:focus{outline:none}
.ic{display:block;flex:none}
.muted{color:var(--muted)}
.small{font-size:15px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.skip{position:absolute;left:-999px;top:8px;z-index:50;background:var(--surface);padding:10px 14px;border-radius:8px}
.skip:focus{left:8px}

/* buttons */
.btn{--c:var(--green);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 22px;border:2px solid var(--c);border-radius:6px;background:var(--c);color:var(--on);font-weight:700;font-size:17.5px;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s,transform .15s}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{background:var(--line);border-color:var(--line);color:var(--muted);cursor:not-allowed}
.btn.sec{background:var(--surface);color:var(--green);border-color:var(--line2)}
.btn.sec:hover:not(:disabled){border-color:var(--green);filter:none}
.btn.blue{--c:var(--blue)}
.btn.warn{--c:var(--red)}
.btn.wide{width:100%}
.btn.sm{min-height:44px;padding:8px 16px;font-size:16px}
.link{background:none;border:0;padding:6px 4px;min-height:44px;color:var(--blue);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* shell */
.rail{display:none}
.main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;z-index:8;background:color-mix(in srgb,var(--canvas) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top-in{max-width:680px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;color:var(--ink)}
.logo .mark{width:32px;height:32px;border-radius:6px;background:var(--green);color:var(--on);display:grid;place-items:center}
.lvl{font-size:14px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.navb{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;justify-content:center;padding:4px 2px;border:0;border-radius:6px;background:none;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.navb[aria-current="page"]{color:var(--green)}
.navb[aria-current="page"] .ic{background:var(--green-t);border-radius:8px;padding:2px 14px;width:auto;box-sizing:content-box}
@media (min-width:900px){
  .bnav{display:none}
  .rail{display:flex;flex-direction:column;gap:4px;position:fixed;inset:0 auto 0 0;width:220px;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface);z-index:9}
  .rail .logo{padding:0 8px 20px}
  .rail .navb{flex-direction:row;justify-content:flex-start;gap:12px;font-size:16.5px;padding:10px 12px;min-height:48px}
  .rail .navb[aria-current="page"]{background:var(--green-t)}
  .rail .navb[aria-current="page"] .ic{background:none;padding:0}
  .main{margin-left:220px;padding-bottom:40px}
  .top .logo{visibility:hidden}
}
.tab{max-width:680px;margin:0 auto;padding-block:20px 32px;display:grid;gap:18px}
@media (min-width:900px){.tab{padding-inline:24px}}
.ph{display:grid;gap:4px}
.ph h1{font-size:26px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;display:grid;gap:10px}
.card.flat{background:transparent;border-style:dashed}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.hero{border-radius:8px;padding:20px;display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.hero.kr{border-color:color-mix(in srgb,var(--green) 40%,var(--line))}
.hero h2{font-size:24px}
.hero .scene{display:flex;gap:12px;align-items:flex-start;background:var(--canvas);border-radius:6px;padding:12px}
.hero .scene .when{font-size:14px;font-weight:700;color:var(--muted)}
.hero .acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:15px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:8px;font-size:14px;font-weight:600;background:var(--canvas);border:1px solid var(--line);color:var(--muted)}
.pill.ok{background:var(--green-t);border-color:transparent;color:var(--green)}
.pill.due{background:var(--amber-t);border-color:transparent;color:var(--amber)}
.pill.info{background:var(--blue-t);border-color:transparent;color:var(--blue)}
.row2{display:flex;align-items:center;gap:12px}
.row2 .t{flex:1;min-width:0;display:grid;gap:2px}
.icb{width:44px;height:44px;border-radius:6px;display:grid;place-items:center;background:var(--green-t);color:var(--green);flex:none}
.cardbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;cursor:pointer;min-height:64px}
.cardbtn:hover{border-color:var(--green)}
.cardbtn .t{flex:1;min-width:0;display:grid;gap:2px}
.cardbtn b{font-size:17.5px}
.chev{color:var(--muted)}
.checklist{list-style:none;padding:0;display:grid;gap:6px}
.checklist li{display:flex;gap:10px;align-items:center}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;flex:none;color:var(--on)}
.ck.on{background:var(--green);border-color:var(--green)}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--green)}
.bar i.due{background:var(--amber)}
.bar i.seen{background:color-mix(in srgb,var(--green) 35%,var(--line))}

/* path */
.arcw{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 12px 6px}
.arc{display:block;width:100%;height:auto}
.arc .sky{fill:url(#skyg)}
.arc text{font:600 12px var(--f);fill:var(--ink)}
.arcstops{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:4px}
.astop{background:none;border:0;border-radius:6px;padding:6px 2px;cursor:pointer;display:grid;justify-items:center;gap:2px;font-size:12.5px;font-weight:600;color:var(--ink);min-height:44px;text-align:center;line-height:1.2}
.astop small{color:var(--muted);font-weight:600;font-size:12px}
.astop:hover{background:var(--canvas)}
@media (max-width:420px){.arcstops{grid-template-columns:repeat(3,1fr)}}
.unit{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.unit>summary{list-style:none;cursor:pointer;padding:16px;display:flex;gap:12px;align-items:flex-start}
.unit>summary::-webkit-details-marker{display:none}
.unit .uic{width:44px;height:44px;border-radius:6px;display:grid;place-items:center;background:color-mix(in srgb,var(--uc) 14%,transparent);color:var(--uc);flex:none}
.unit .uh{flex:1;min-width:0;display:grid;gap:4px}
.unit .un{font-size:13.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--uc)}
.unit h2{font-size:20px}
.unit .tog{transition:transform .2s;color:var(--muted);margin-top:10px}
.unit[open] .tog{transform:rotate(90deg)}
.lessons{list-style:none;padding:0 8px 10px;margin:0;display:grid;gap:2px}
.lbtn{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:10px;cursor:pointer;min-height:60px}
.lbtn:hover{background:var(--canvas)}
.lbtn .num{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;border:2px solid var(--line2);color:var(--muted);flex:none;background:var(--surface)}
.lbtn.done .num{background:var(--uc);border-color:var(--uc);color:var(--on)}
.lbtn.prog .num{border-color:var(--uc);color:var(--uc)}
.lbtn .t{flex:1;min-width:0;display:grid;gap:1px}
.lbtn .t b{font-weight:600;font-size:17px}
.lbtn .t span{font-size:14.5px;color:var(--muted)}
.lbtn.locked .num{border-style:dashed}
.cpaths{display:grid;gap:8px}
.cpath{border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--surface)}
.cpath summary{cursor:pointer;font-weight:600;min-height:28px}
.cpath ol{padding-left:20px;margin-top:8px;display:grid;gap:4px}

/* safety card */
.urgent{display:grid;gap:10px}
.call{display:flex;align-items:center;gap:12px;padding:14px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.call.em{border-color:var(--red);background:var(--red-t)}
.call .t{flex:1;min-width:0;display:grid;gap:2px}
.call .n{font-size:22px;font-weight:700;letter-spacing:.01em}
.call .em-l{color:var(--red);font-weight:700}
.callacts{display:flex;gap:6px;flex:none}
.iconbtn{width:48px;height:48px;border-radius:6px;border:1px solid var(--line2);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--green);text-decoration:none}
.iconbtn:hover{border-color:var(--green)}
.phrase{border-left:4px solid var(--blue);background:var(--blue-t);border-radius:6px;padding:12px 14px}
.facts{display:grid;gap:12px}
.fact{display:flex;gap:12px;align-items:flex-start}
.fact .ic{color:var(--green);margin-top:3px}
.numlist{display:grid}
.numrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.numrow:first-child{border-top:0}
.numrow span{flex:1;min-width:0}
.numrow b{white-space:nowrap}
.srcs{font-size:15px}
.srcs ul{padding-left:18px;display:grid;gap:4px;margin-top:6px}

/* me + building */
.bld{display:block;width:100%;max-width:460px;margin:0 auto;height:auto;border-radius:6px}
.bld .wall{fill:var(--surface);stroke:var(--line2);stroke-width:2}
.bld .glass{fill:var(--line)}
.bld .lit{fill:var(--gold)}
.bld .half{fill:color-mix(in srgb,var(--gold) 45%,var(--line))}
.bld text{font:600 11.5px var(--f);fill:var(--muted)}
.ulist{list-style:none;padding:0;display:grid;gap:12px}
.ulist li{display:grid;gap:6px}
.ulist .l1{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bdg{border:1px solid var(--line);border-radius:6px;padding:12px;display:grid;gap:4px;justify-items:start;background:var(--surface)}
.bdg .bi{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--green-t);color:var(--green)}
.bdg.off .bi{background:var(--canvas);color:var(--muted)}
.bdg b{font-size:16px}
.bdg small{color:var(--muted);font-size:14px;line-height:1.35}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:44px;padding:8px 14px;border-radius:6px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on)}
.missions{display:grid;gap:10px}
.mis{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.mis.done{background:var(--green-t);border-color:transparent}
.mis .t{flex:1;min-width:0;display:grid;gap:6px}
.mis .acts{display:flex;flex-wrap:wrap;gap:8px}
input[type=text],textarea,select{width:100%;min-height:48px;padding:10px 12px;border-radius:6px;border:1px solid var(--line2);background:var(--surface)}
textarea{min-height:90px}
.lbl{font-weight:600;font-size:15.5px}
details.more summary,details.pcode summary{cursor:pointer;font-weight:600;color:var(--blue);min-height:44px;display:flex;align-items:center}
.ktab{border-collapse:collapse;width:100%;font-size:15px}
.ktab th,.ktab td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
.tscroll{overflow-x:auto}

/* overlays */
.overlay{position:fixed;inset:0;z-index:20;background:var(--canvas);display:flex;flex-direction:column}
.otop{display:flex;align-items:center;gap:12px;min-height:60px;border-bottom:1px solid var(--line);background:var(--surface)}
.otop-in{max-width:760px;width:100%;margin:0 auto;display:flex;align-items:center;gap:12px}
.xbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:44px;padding:6px 10px;border:1px solid var(--line2);border-radius:6px;background:var(--surface);cursor:pointer;font-weight:600}
.pbar{flex:1;height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--green);transition:width .25s}
.pcount{font-size:14.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.obody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.oin{max-width:680px;margin:0 auto;padding-block:22px 28px;display:grid;gap:16px}
.ofoot{border-top:1px solid var(--line);background:var(--surface);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
.ofoot-in{max-width:680px;margin:0 auto;display:flex;gap:10px;justify-content:space-between}
.ofoot-in .btn{flex:1}
.ofoot-in .btn.sec{flex:0 0 auto}
@media (min-width:600px){.ofoot-in{justify-content:flex-end}.ofoot-in .btn{flex:0 0 auto;min-width:180px}}
.dlg{position:fixed;inset:0;z-index:40;background:var(--shade);display:grid;place-items:center;padding:16px}
.dlg-in{background:var(--surface);border-radius:8px;padding:22px;max-width:420px;width:100%;display:grid;gap:12px}
.dlg-acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--canvas);padding:10px 16px;border-radius:6px;font-weight:600;display:flex;align-items:center;gap:8px;max-width:calc(100vw - 32px);box-shadow:0 6px 20px rgba(0,0,0,.18)}
@media (min-width:900px){.toast{bottom:28px}}

/* lesson content */
.tag{font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.qh{font-size:23px;line-height:1.25}
.lead{font-size:18.5px}
.goalbox{border-left:4px solid var(--uc,var(--green));background:var(--surface);border-radius:6px;padding:12px 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0}
.chips li{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:15px;font-weight:600}
.intro-img{margin:0;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#fff}
.intro-img img{display:block;width:100%;height:auto}
.qimg{max-width:460px;justify-self:center;width:100%}
.scene2{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.scene2.alarm{border-color:var(--red);background:var(--red-t)}
.scene2 .when{font-size:14.5px;font-weight:700;color:var(--muted)}
.txt{font-size:18.5px}
.tpts{list-style:none;padding:0;display:grid;gap:10px}
.tpts li{display:flex;gap:10px;align-items:flex-start;font-size:18px}
.tpts .dot{width:24px;height:24px;border-radius:50%;background:var(--green-t);color:var(--green);display:grid;place-items:center;flex:none;margin-top:2px}
.more ul{padding-left:20px;display:grid;gap:6px;margin-top:4px}
.wsteps{padding-left:22px;display:grid;gap:10px}
.wsteps li::marker{font-weight:700;color:var(--green)}
.hint{color:var(--muted);font-size:15.5px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;min-height:56px;padding:12px 14px;border:2px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;font-size:17.5px}
.opt:hover:not(:disabled){border-color:var(--line2)}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-t)}
.opt .key{width:28px;height:28px;border-radius:8px;border:1px solid var(--line2);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--muted);flex:none;background:var(--surface)}
.opt[aria-pressed="true"] .key{background:var(--blue);border-color:var(--blue);color:var(--on)}

/* ===== Illustrated editorial direction ===== */
:root{--canvas:#FFFFFF; --surface:#FFFFFF; --paper:#F5F5F5; --paper2:#EBEBEB; --ink:#2B292A; --muted:#595959; --forest:#275D38; --moss:#275D38; --gold:#F2CD00; --terra:#E56A54;
  --green:#275D38; --green-d:#1E4A2C; --green-t:#EAF1EC; --line:#E0E0E0; --line2:#CCCCCC; --serif:"Roboto Slab",Georgia,"Times New Roman",serif; --bg2:#F5F5F5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--canvas:#121714;--surface:#121714;--paper:#1C231E;--paper2:#252E27;--ink:#ECEDE7;--muted:#A9B1A7;--forest:#8CC49A;--moss:#8CC49A;--green:#8CC49A;--green-d:#6FA77E;--green-t:#1D2A21;--line:#2A332C;--line2:#3A453C;--terra:#E3896B;--bg2:#1C231E}}
:root[data-theme="dark"]{--canvas:#121714;--surface:#121714;--paper:#1C231E;--paper2:#252E27;--ink:#ECEDE7;--muted:#A9B1A7;--forest:#8CC49A;--moss:#8CC49A;--green:#8CC49A;--green-d:#6FA77E;--green-t:#1D2A21;--line:#2A332C;--line2:#3A453C;--terra:#E3896B;--bg2:#1C231E}
body{background:var(--canvas)}
h1,h2,h3,.qh,.hero h2,.unit h2{font-family:var(--serif);font-weight:600;letter-spacing:-.01em}
.ph h1,h1{font-size:30px;line-height:1.12}
.qh{font-size:25px}
.eyebrow,.tag{text-transform:none;letter-spacing:0;font-size:14.5px;color:var(--moss)}
.k2{font-size:14px;font-weight:700;color:var(--moss)}
/* surfaces: tonal panels, no borders */
.card,.hcard,.panel,.cmp-c,.model li,.mis,.bdg,.st,.call,.cpath{background:var(--paper);border:0;border-radius:8px;box-shadow:none}
.card.flat,.hcard.flat{background:transparent;border:1px dashed var(--line2)}
.panel{padding:16px;display:grid;gap:10px}
.mis.done{background:var(--green-t)}
.call.em{background:#FCEDEA;border:0}

.phrase{background:#FFF8D1;border-left:0;border-radius:8px}

:root{--green:#275D38;--green-d:#1E4A2C;--green-t:#EAF1EC;--forest:#275D38;--moss:#275D38;--brand:#275D38;--brand-d:#1E4A2C;--brand-hi:#007A33;
 --gold:#F2CD00;--yellow:#F2CD00;--terra:#E56A54;--ink:#2B292A;--muted:#595959;--canvas:#FFFFFF;--surface:#FFFFFF;--paper:#F5F5F5;--paper2:#EBEBEB;--bg2:#F5F5F5;
 --line:#E0E0E0;--line2:#CCCCCC;--blue:#275D38;--blue-t:#EAF1EC;--amber:#2B292A;--amber-t:#FFF8D1;
 --u1:#275D38;--u2:#007A33;--u3:#275D38;--u4:#007A33;--u5:#2B292A;--uf:#275D38;
 --serif:"Roboto Slab",Georgia,serif;--f:"Roboto",Calibri,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}

.hbtn{color:#275D38}
